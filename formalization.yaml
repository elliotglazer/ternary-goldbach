# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: Unconditional ternary Goldbach in Lean
  authors: [Elliot Glazer]
  responsible_maintainers: [Elliot Glazer]
  license: Apache-2.0
  description: >-
    Every odd natural number greater than five is the sum of three primes.
    This project closes Charlie Reams’s formalization of Harald Helfgott’s
    theorem using a kernel-checked finite prefix, analytic bounds and
    the community RH and primitive Dirichlet GRH declarations.

sources:
  - title: The ternary Goldbach problem
    authors: [Harald Andrés Helfgott]
    type: book
    id: https://arxiv.org/abs/1501.05438
    relationship: formalizes

related_formalizations:
  - id: https://github.com/calr3/ternary-goldbach/tree/23b2d68ca344203d4384e0aff7affa4ec034bef9
    relationship: builds-on
    note: Charlie Reams’s formalization supplies the analytic Goldbach argument.
  - id: https://github.com/leanprover-community/riemann-hypothesis/tree/72fead102f663d5c7a407964a13dc0cf9d977207/grh-compact
    relationship: builds-on
    note: >-
      The final application uses riemannHypothesis and LFunction_eq_zero_re_of_isPrimitive
      from the source-bundled compact community GRH project.

classification:
  arxiv: [math.NT]
  msc2020: ["11P32", "11N05"]

status:
  scope: >-
    The historical Lean 4.33.1 release checked binary Goldbach
    through 564386325504, extended the finite range through 2 × 10^19, and
    combined 223 analytic intervals with an infinite-tail estimate.
  main_results:
    - declaration: CompletedGoldbach.ternary_goldbach
      file: CompletedGoldbach.lean
      sorry_count: 0
      axioms: [propext, Classical.choice, Quot.sound]

automation:
  methods:
    - method: agent
      models: [ChatGPT 6.2 Astra]
      framework: Codex
      prompting_notes: Elliot Glazer directed the proof integration and computational checks.

review:
  status: self-assessed
  notes: >-
    The 4.33.1 release recorded the displayed axiom inventory. Full replay of the
    4.35.0 compact-source package is pending.
